# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
builds:
- env:
    # goreleaser does not work with CGO, it could also complicate
    # usage by users in CI/CD systems like HCP Terraform where
    # they are unable to install libraries.
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -mod=readonly
    - -trimpath
  ldflags:
    - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
  goos:
    - freebsd
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: '386'
    - goos: windows
      goarch: arm
  binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
- formats:
  - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
sboms:
- id: provider-archives
  artifacts: archive
  args:
    - '$artifact'
    - '--output'
    - 'spdx-json=$document'
  env:
    - 'GOMODCACHE={{ .Env.GOMODCACHE }}'
    - 'GOCACHE={{ .Env.GOCACHE }}'
    - 'GOPROXY=off'
    - 'GONOPROXY=none'
    - 'SYFT_CHECK_FOR_APP_UPDATE=false'
    - 'SYFT_ENRICH='
    - 'SYFT_CACHE_TTL=0'
    - 'SYFT_GOLANG_LOCAL_MOD_CACHE_DIR={{ .Env.GOMODCACHE }}'
    - 'SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES=true'
    - 'SYFT_GOLANG_SEARCH_LOCAL_VENDOR_LICENSES=false'
    - 'SYFT_GOLANG_SEARCH_REMOTE_LICENSES=false'
    - 'SYFT_GOLANG_PROXY=file://{{ .Env.GOMODCACHE }}/cache/download'
    - 'SYFT_GOLANG_NO_PROXY=none'
    - 'SYFT_GOLANG_USE_PACKAGES_LIB=false'
    - 'SYFT_JAVA_USE_NETWORK=false'
    - 'SYFT_JAVASCRIPT_SEARCH_REMOTE_LICENSES=false'
    - 'SYFT_PYTHON_SEARCH_REMOTE_LICENSES=false'
    - 'SYFT_CPP_VCPKG_ALLOW_GIT_CLONE=false'
    - 'SYFT_FILE_METADATA_CATALOGER_ENABLED=true'
  documents:
    - '${artifact}.spdx.json'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true
changelog:
  disable: true
