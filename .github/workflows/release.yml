name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-sbom:
    name: Release SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release SBOMs
        uses: ./.github/actions/verify-release-sboms

  goreleaser:
    needs: release-sbom
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install authenticated release tools
        uses: ./.github/actions/setup-release-tools

      - name: Verify release dependencies
        uses: ./.github/actions/verify-release-dependencies

      - name: Build trusted release verifier
        run: |
          GOCACHE="$(mktemp -d "$RUNNER_TEMP/release-go-build-cache.XXXXXX")"
          export GOCACHE
          echo "GOCACHE=$GOCACHE" >> "$GITHUB_ENV"
          go build -trimpath -o "$RUNNER_TEMP/release-verifier" .github/actions/verify-release-sboms/verify.go
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        env:
          GONOPROXY: "none"
          GOPROXY: "off"

      - name: Check publish environment secrets
        env:
          HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAS_GPG_PASSPHRASE: ${{ secrets.PASSPHRASE != '' }}
        run: |
          test "$HAS_GPG_PRIVATE_KEY" = true
          test "$HAS_GPG_PASSPHRASE" = true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        id: goreleaser
        run: |
          export PATH="$RELEASE_TOOLS_DIR:$PATH"
          "$RELEASE_TOOLS_DIR/goreleaser" release --clean --draft
          echo "checksums=dist/terraform-provider-openai_${GITHUB_REF_NAME#v}_SHA256SUMS" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GONOPROXY: "none"
          GOPROXY: "off"

      - name: Attest verified release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.goreleaser.outputs.checksums }}

      - name: Verify provider archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
          done

      - name: Verify and publish release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: release-verifier --publish "$GITHUB_REF_NAME" "$GPG_FINGERPRINT"
